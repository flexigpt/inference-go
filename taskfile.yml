# https://taskfile.dev

version: "3"

includes:
  git:
    taskfile: https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/git.yml
    checksum: b22093001cd4d15f3ccf39ba4ccf16e509468379ac24d25f79196f277a7f02b0
    flatten: true

  go:
    taskfile: https://raw.githubusercontent.com/flexigpt/.github/refs/heads/main/tasks/go.yml
    checksum: e4cc5aea758c6d79d92c78021d32a5b8c9cf086933000f3a715b0b83266f99ed
    flatten: true
    dir: "{{.ROOT_DIR}}"
    vars:
      GREETING: Hello, these are Inference Go tasks!
      DEPGRAPH_ENTRY_POINT: provider_set.go

dotenv:
  - .env

tasks:
  test:catalog:
    cmds:
      - go test -count=1 -v ./modelpreset
      - go test -count=1 -v . -run '^TestCatalogPresetsIntegrateWithProviderSet$'

  test:anthropic:
    cmds:
      - go test -count=1 -v ./internal/anthropicsdk
      - go test -count=1 -v ./internal/integration -run '^(Example_anthropic_basicConversation|Example_anthropic_toolsAndThinkingStreaming|Example_anthropic_functionToolRoundTrip)$'

  test:openaichat:
    cmds:
      - go test -count=1 -v ./internal/openaichatsdk
      - go test -count=1 -v ./internal/sdkutil
      - go test -count=1 -v ./internal/integration -run '^(Example_openAIChat_basicConversation|Example_openAIChat_toolsAndJSONSchema)$'

  test:openairesponses:
    cmds:
      - go test -count=1 -v ./internal/openairesponsessdk
      - go test -count=1 -v ./internal/sdkutil
      - go test -count=1 -v ./internal/integration -run '^(Example_openAIResponses_basicConversation|Example_openAIResponses_toolsAndAttachments)$'

  test:google:
    cmds:
      - go test -count=1 -v ./internal/googlegeneratecontentsdk
      - go test -count=1 -v ./internal/sdkutil
      - go test -count=1 -v ./internal/integration -run '^(Example_googleGenerateContent_basicConversation|Example_googleGenerateContent_functionToolRoundTrip|Example_googleGenerateContent_webSearchAndThinkingStreaming|TestGoogleGenerateContent_FunctionToolRoundTripLoop)$'

  test:meta:
    deps:
      - test:catalog
    cmds:
      - go test -count=1 -v ./internal/openairesponsessdk
      - go test -count=1 -v ./internal/sdkutil -run '^TestNormalizeRequestForSDKReasoningContextAndMode$'
      - go test -count=1 -v ./internal/integration -run '^(TestMetaMultiParameterNormalization|Example_meta_basicConversation|Example_meta_multiParameterStreaming)$'
